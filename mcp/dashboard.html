<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn with Claude</title>
<script>try { const t = localStorage.getItem('learn.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  @font-face { font-family: "Geist"; src: url("/fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

  /* Quiet neutrals, one white canvas, color only where it means something (live, right, wrong). */
  :root {
    --canvas: #f4f4f4; --paper: #ffffff; --soft: #f7f7f7; --hover: rgba(0,0,0,.045);
    --ink: #1d2027; --ink-2: #545a66; --ink-3: #8a909b; --line: rgba(0,0,0,.07); --line-2: rgba(0,0,0,.14);
    --dark: #18181b; --dark-ink: #ffffff;
    --signal: #d7492a;
    --good: #2f7a4f; --good-bg: #f1f8f4; --good-line: rgba(47,122,79,.35);
    --bad: #b8432b; --bad-bg: #fdf3f0; --bad-line: rgba(184,67,43,.32);
    --shadow: 0 1px 2px rgba(0,0,0,.03);
    --raise: 0 1px 2px rgba(0,0,0,.08);
    /* Chart marks only (text never wears these). Validated: status pair + one-hue ordinal ramp. */
    --c-good: #0f8a6e; --c-bad: #c2452d;
    --o1: #a9aeb8; --o2: #828895; --o3: #575d68; --o4: #2a2e35;
    --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Dark: follows the system unless the viewer picked a theme with the toggle. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0e0e10; --paper: #17171a; --soft: #1f1f23; --hover: rgba(255,255,255,.06);
      --ink: #ececee; --ink-2: #a4a6ad; --ink-3: #74767e; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.18);
      --dark: #ececee; --dark-ink: #111113;
      --good: #6cc191; --good-bg: rgba(108,193,145,.08); --good-line: rgba(108,193,145,.35);
      --bad: #ee8b74; --bad-bg: rgba(238,139,116,.08); --bad-line: rgba(238,139,116,.32);
      --shadow: none; --raise: 0 1px 2px rgba(0,0,0,.4); --c-good: #3aa58c; --c-bad: #e0694e; --o1: #5f626b; --o2: #878a93; --o3: #b0b3ba; --o4: #e6e7ea;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0e0e10; --paper: #17171a; --soft: #1f1f23; --hover: rgba(255,255,255,.06);
    --ink: #ececee; --ink-2: #a4a6ad; --ink-3: #74767e; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.18);
    --dark: #ececee; --dark-ink: #111113;
    --good: #6cc191; --good-bg: rgba(108,193,145,.08); --good-line: rgba(108,193,145,.35);
    --bad: #ee8b74; --bad-bg: rgba(238,139,116,.08); --bad-line: rgba(238,139,116,.32);
    --shadow: none; --raise: 0 1px 2px rgba(0,0,0,.4); --c-good: #3aa58c; --c-bad: #e0694e; --o1: #5f626b; --o2: #878a93; --o3: #b0b3ba; --o4: #e6e7ea;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas); color: var(--ink); font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "ss01"; overflow-x: clip; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
  ::selection { background: rgba(215,73,42,.18); }
  code { font-family: var(--mono); font-size: .88em; padding: 1px 5px; border-radius: 5px; background: var(--soft); }
  pre { margin: 12px 0 2px; padding: 14px 16px; border-radius: 12px; background: var(--soft); overflow-x: auto; }
  pre code { padding: 0; background: none; font-size: 12.5px; line-height: 1.65; }
  .tnum { font-variant-numeric: tabular-nums; }
  svg.i { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- shell ---------- */
  .app { display: flex; height: 100dvh; }
  .rail { width: 60px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0; }
  .mark { width: 32px; height: 32px; margin-bottom: 10px; border-radius: 10px; background: var(--dark); color: var(--dark-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; letter-spacing: -.02em; }
  .rail-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2); transition: background .15s, color .15s; }
  .rail-btn:hover { background: var(--hover); color: var(--ink); }
  .rail-btn[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: var(--raise); }
  .rail-btn .flag { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .rail-btn .flag.live { background: var(--signal); animation: pulse 1.6s ease-in-out infinite; }
  .rail { position: relative; z-index: 20; }
  .rail .spacer { flex: 1; }
  /* Tooltips: the label slides out to the right of the icon. */
  .rail-btn[data-tip]::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translate(-4px, -50%); padding: 5px 10px; border-radius: 8px; background: var(--dark); color: var(--dark-ink); font-size: 12px; font-weight: 500; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; box-shadow: 0 6px 20px -8px rgba(0,0,0,.35); }
  .rail-btn[data-tip]:hover::after, .rail-btn[data-tip]:focus-visible::after { opacity: 1; transform: translate(0, -50%); transition-delay: .25s; }
  .canvas { flex: 1; min-width: 0; display: flex; flex-direction: column; margin: 8px 8px 8px 0; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .brand { font-size: 14px; font-weight: 500; letter-spacing: -.01em; }
  .brand span { color: var(--ink-3); font-weight: 400; }
  .bar-meta { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-3); }
  .bar-meta { align-items: center; }
  .agent { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--soft); color: var(--ink-2); font-size: 12.5px; max-width: min(380px, 46vw); }
  .agent:empty { display: none; }
  .agent .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
  .agent.working .dot { background: var(--signal); animation: pulse 1.6s ease-in-out infinite; }
  .agent.waiting { background: var(--dark); color: var(--dark-ink); }
  .agent.waiting .dot { background: var(--signal); }
  .agent.done svg { width: 14px; height: 14px; stroke-width: 2; color: var(--good); }
  button.agent { cursor: pointer; }
  button.agent:hover { filter: brightness(.97); }
  .agent .more { font: 500 11px var(--mono); padding-left: 7px; margin-left: 2px; border-left: 1px solid currentColor; opacity: .55; }
  .sessions { position: absolute; top: 46px; right: 16px; z-index: 40; width: min(380px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; padding: 6px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); box-shadow: 0 16px 48px -16px rgba(0,0,0,.3); animation: arrive .18s ease-out; }
  .sessions h4 { margin: 6px 10px 6px; font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .session { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 10px; border-radius: 10px; }
  .session > .body2 { display: block; min-width: 0; }
  .session:hover { background: var(--hover); }
  .session .dot { width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
  .session[data-st="working"] .dot { background: var(--signal); animation: pulse 1.6s ease-in-out infinite; }
  .session[data-st="waiting"] .dot { background: var(--signal); }
  .session[data-st="done"] .dot { background: var(--good); }
  .session .name { font-size: 13.5px; font-weight: 500; }
  .session .state { font-size: 12.5px; color: var(--ink-3); }
  .session .msg { margin-top: 4px; font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .bar { position: relative; }
  .switch { display: flex; gap: 2px; margin-bottom: 28px; padding: 4px; border-radius: 999px; background: var(--soft); width: fit-content; max-width: 100%; overflow-x: auto; }
  .switch button { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .switch button:hover { color: var(--ink); }
  .switch button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: var(--raise); }
  .switch .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); animation: pulse 1.6s ease-in-out infinite; }
  .agent .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bell { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-3); }
  .bell:hover { background: var(--hover); color: var(--ink); }
  .bell svg { width: 16px; height: 16px; }
  .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; width: min(360px, calc(100vw - 32px)); }
  .toast { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 14px 16px; border-radius: 14px; background: var(--dark); color: var(--dark-ink); box-shadow: 0 12px 40px -12px rgba(0,0,0,.35); animation: arrive .3s cubic-bezier(.2,.7,.2,1); }
  .toast .eyebrow { color: inherit; opacity: .6; }
  .toast .msg { margin-top: 2px; font-size: 13.5px; line-height: 1.45; }
  .toast .close { margin-left: auto; opacity: .6; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; }
  .toast .close:hover { opacity: 1; }
  .toast .close svg { width: 14px; height: 14px; }
  .tabs { display: none; gap: 2px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tab { height: 32px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--ink-3); white-space: nowrap; transition: color .15s, background .15s; }
  .tab:hover { color: var(--ink); }
  .tab[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 500; }
  .scroll { flex: 1; overflow-y: auto; }
  .content { max-width: 680px; margin: 0 auto; padding: 48px 24px 96px; }
  @media (max-width: 760px) {
    .rail { display: none; }
    .canvas { margin: 0; border-radius: 0; border: 0; }
    .tabs { display: flex; }
    .bar { padding: 0 16px; }
    .content { padding: 28px 16px 72px; }
    #due, #streak, .brand span { display: none; }
  }

  /* ---------- type ---------- */
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .title { margin: 6px 0 0; font-size: 28px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
  .lede { margin: 8px 0 0; font-size: 14.5px; color: var(--ink-3); }
  .head { margin-bottom: 32px; }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .status.live { color: var(--ink); }
  .status.live .dot { background: var(--signal); animation: pulse 1.6s ease-in-out infinite; }
  .section { margin: 40px 0 12px; }

  /* ---------- surfaces ---------- */
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; }
  .soft { background: var(--soft); border-radius: 16px; padding: 16px 18px; color: var(--ink-2); }
  .soft .eyebrow { margin-bottom: 6px; }
  .soft b, .panel b { color: var(--ink); font-weight: 600; }
  .panel h3 { margin: 6px 0 6px; font-size: 16px; font-weight: 500; letter-spacing: -.01em; }
  .body { color: var(--ink-2); font-size: 14px; }
  .q { margin: 8px 0 16px; font-size: 16.5px; font-weight: 500; letter-spacing: -.01em; line-height: 1.45; }
  .locked { border-style: dashed; background: transparent; }
  .locked h3 { color: var(--ink-3); }
  .locked .hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
  .locked .hint svg { width: 15px; height: 15px; }

  /* ---------- options ---------- */
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 14px; line-height: 1.5; transition: border-color .15s, background .15s; }
  .opt:hover:not(:disabled) { border-color: var(--line-2); background: var(--soft); }
  .opt .key { width: 22px; height: 22px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--line); font: 500 11px var(--mono); color: var(--ink-3); }
  .opt:disabled { color: var(--ink-3); }
  .opt.right { border-color: var(--good-line); background: var(--good-bg); color: var(--ink); }
  .opt.wrong { border-color: var(--bad-line); background: var(--bad-bg); color: var(--ink); }
  .opt.right .key, .opt.wrong .key { border: 0; }
  .opt.right .key { color: var(--good); }
  .opt.wrong .key { color: var(--bad); }
  .opt .key svg { width: 15px; height: 15px; stroke-width: 2; }
  .verdict { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .verdict .label { font-size: 13px; font-weight: 500; }
  .verdict.right .label { color: var(--good); }
  .verdict.wrong .label { color: var(--bad); }
  .verdict .body { margin-top: 4px; }
  .verdict .note { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }

  /* ---------- controls ---------- */
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 20px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-size: 13.5px; color: var(--ink); transition: border-color .15s, background .15s, transform .05s; }
  .btn:hover { border-color: var(--line-2); }
  .btn:active { transform: translateY(1px); }
  .btn-dark { background: var(--dark); border-color: var(--dark); color: var(--dark-ink); }
  .btn-dark:hover { opacity: .9; border-color: var(--dark); }
  kbd { font: 500 11px var(--mono); color: var(--ink-3); }
  .btn-dark kbd { color: inherit; opacity: .6; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 24px; padding: 4px; border-radius: 999px; background: var(--soft); }
  .grades button { height: 34px; border-radius: 999px; font-size: 13px; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, color .15s; }
  .grades button:hover { background: var(--paper); color: var(--ink); box-shadow: var(--raise); }
  textarea { display: block; width: 100%; margin-top: 20px; min-height: 76px; padding: 12px 14px; border: 1px solid transparent; border-radius: 12px; background: var(--soft); color: var(--ink); font: 14px/1.55 var(--sans); resize: vertical; outline: none; transition: border-color .15s; }
  textarea:focus { border-color: var(--line-2); }
  textarea::placeholder { color: var(--ink-3); }
  .track { height: 2px; border-radius: 2px; background: var(--line); margin-bottom: 28px; overflow: hidden; }
  .track div { height: 100%; background: var(--ink); transition: width .35s ease; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
  .card-front { font-size: 21px; font-weight: 500; letter-spacing: -.015em; line-height: 1.4; }
  .card-back { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 15px; color: var(--ink-2); }
  .counter { font: 500 11px var(--mono); letter-spacing: .06em; color: var(--ink-3); }
  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }

  /* ---------- walkthrough, figures, lists ---------- */
  .change { padding: 14px 0; border-top: 1px solid var(--line); }
  .change:first-of-type { border-top: 0; padding-top: 4px; }
  .change .file { font: 12px var(--mono); color: var(--ink-3); }
  .change .what { margin-top: 2px; color: var(--ink); }
  .change .why { margin-top: 2px; font-size: 13px; color: var(--ink-3); }
  .figures { display: grid; grid-template-columns: repeat(3, 1fr); }
  .figures.four { grid-template-columns: repeat(4, 1fr); }
  .figures.four .figure:nth-child(3n+1) { border-left: 1px solid var(--line); }
  .figures.four .figure:first-child { border-left: 0; }
  .figures.four .figure:nth-child(n+4) { border-top: 0; }
  @media (max-width: 760px) { .figures.four { grid-template-columns: repeat(2, 1fr); } .figures.four .figure:nth-child(3) { border-left: 0; } .figures.four .figure:nth-child(n+3) { border-top: 1px solid var(--line); } }
  .figure { padding: 18px 22px; border-left: 1px solid var(--line); }
  .figure:nth-child(3n+1) { border-left: 0; }
  .figure:nth-child(n+4) { border-top: 1px solid var(--line); }
  .figure .v { font-size: 24px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
  .figure .u { margin-top: 2px; font-size: 12px; color: var(--ink-3); }
  .panel.flush { padding: 0; overflow: hidden; }
  .results { list-style: none; margin: 16px 0 0; padding: 0; }
  .results li { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .results li svg { width: 16px; height: 16px; margin-top: 3px; stroke-width: 2; }
  .results .ok { color: var(--good); } .results .no { color: var(--bad); }
  .results .sub { font-size: 13px; color: var(--ink-3); }
  .lesson-row { display: block; width: 100%; text-align: left; }
  .lesson-meta { display: flex; gap: 10px; font-size: 12px; color: var(--ink-3); }
  .lesson-meta .tnum { margin-left: auto; }

  /* ---------- charts ---------- */
  .chart-card { padding: 20px 22px 16px; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .chart-head h3 { margin: 0; font-size: 14px; font-weight: 500; }
  .chart-head .sub { font-size: 12.5px; color: var(--ink-3); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .cols { position: relative; display: grid; grid-template-columns: repeat(14, 1fr); align-items: end; height: 140px; border-bottom: 1px solid var(--line); }
  .cols .grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
  .cols .grid span { position: absolute; right: 0; top: -16px; font: 11px var(--mono); color: var(--ink-3); }
  .col { position: relative; height: 100%; display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; cursor: default; outline: none; }
  .col .seg { width: min(20px, 60%); }
  .col .seg:last-child { border-radius: 4px 4px 0 0; }
  .col:hover .seg, .col:focus-visible .seg { filter: brightness(1.12); }
  .col:focus-visible { box-shadow: inset 0 0 0 1px var(--line-2); border-radius: 6px; }
  .xlabels { display: grid; grid-template-columns: repeat(14, 1fr); margin-top: 8px; font: 11px var(--mono); color: var(--ink-3); text-align: center; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: minmax(80px, 150px) 1fr 132px; align-items: center; gap: 12px; font-size: 13px; outline: none; border-radius: 8px; }
  .bar-row:hover .fill, .bar-row:focus-visible .fill { filter: brightness(1.12); }
  .bar-row:focus-visible { box-shadow: 0 0 0 2px var(--line-2); }
  .bar-row .name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row .lane { position: relative; height: 14px; }
  .bar-row .fill { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row .val { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
  .bar-row .val b { color: var(--ink); font-weight: 500; }
  .bar-axis { display: grid; grid-template-columns: minmax(80px, 150px) 1fr 132px; gap: 12px; margin-top: 10px; font: 11px var(--mono); color: var(--ink-3); }
  .bar-axis .ticks { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 4px; }
  .flag-txt { font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-left: 6px; }
  .stack-bar { display: flex; gap: 2px; height: 16px; }
  .stack-bar div { min-width: 3px; outline: none; }
  .stack-bar div:first-child { border-radius: 4px 0 0 4px; }
  .stack-bar div:last-child { border-radius: 0 4px 4px 0; }
  .stack-bar div:only-child { border-radius: 4px; }
  .stack-bar div:hover, .stack-bar div:focus-visible { filter: brightness(1.12); }
  .stack-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 12.5px; color: var(--ink-2); }
  .stack-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .stack-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .stack-legend b { color: var(--ink); font-weight: 500; }
  details.table { margin-top: 14px; font-size: 12.5px; color: var(--ink-3); }
  details.table summary { cursor: pointer; width: fit-content; }
  details.table summary:hover { color: var(--ink); }
  details.table table { width: 100%; margin-top: 10px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  details.table th, details.table td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  details.table th { font-weight: 500; color: var(--ink-2); }
  .tip { position: fixed; z-index: 70; pointer-events: none; min-width: 140px; padding: 10px 12px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line); box-shadow: 0 12px 32px -12px rgba(0,0,0,.3); font-size: 12px; color: var(--ink-3); }
  .tip .t { margin-bottom: 6px; color: var(--ink-2); font-weight: 500; }
  .tip .r { display: flex; align-items: center; gap: 8px; margin-top: 3px; }
  .tip .r i { width: 10px; height: 2px; border-radius: 1px; display: inline-block; }
  .tip .r b { color: var(--ink); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
  .insight { font-size: 15px; line-height: 1.6; color: var(--ink-2); max-width: 60ch; }
  .insight b { color: var(--ink); font-weight: 500; }

  /* ---------- quiz home ---------- */
  .meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .meter div { height: 100%; border-radius: 3px; background: var(--c-good); }
  .lesson-quiz { display: grid; grid-template-columns: 1fr 140px auto; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
  .lesson-quiz:first-child { border-top: 0; padding-top: 0; }
  .lesson-quiz:last-child { padding-bottom: 0; }
  .lesson-quiz .t { font-size: 14px; font-weight: 500; }
  .lesson-quiz .m { font-size: 12px; color: var(--ink-3); }
  .lesson-quiz .score { font-size: 12px; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { .lesson-quiz { grid-template-columns: 1fr auto; } .lesson-quiz .meter-col { display: none; } }
  .btn-sm { height: 30px; padding: 0 12px; font-size: 12.5px; }
  .seg-filter { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--soft); margin-bottom: 14px; max-width: 100%; overflow-x: auto; }
  .seg-filter button { height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
  .seg-filter button[aria-pressed="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: var(--raise); }
  .seg-filter .n { font: 11px var(--mono); color: var(--ink-3); margin-left: 4px; }
  .qrow { border-top: 1px solid var(--line); }
  .qrow:first-child { border-top: 0; }
  .qrow-head { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; padding: 12px 4px; }
  .qrow-head .ic { width: 16px; height: 16px; margin-top: 3px; flex-shrink: 0; display: grid; place-items: center; }
  .qrow-head .ic svg { width: 16px; height: 16px; stroke-width: 2; }
  .qrow-head .ic.ok { color: var(--good); } .qrow-head .ic.no { color: var(--bad); }
  .qrow-head .ic.new::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .qrow-head .qt { flex: 1; min-width: 0; font-size: 14px; }
  .qrow-head .qm { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
  .qrow-head .act { flex-shrink: 0; }
  .qrow .reveal { margin: 0 4px 14px 32px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 13.5px; color: var(--ink-2); }
  .qrow .reveal b { color: var(--ink); font-weight: 500; }
  .link { font-size: 12.5px; color: var(--ink-3); text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--ink); }

  /* ---------- empty, waiting, motion ---------- */
  .empty { min-height: 52vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .empty svg.i { width: 40px; height: 40px; stroke-width: 1; color: var(--ink-3); }
  .empty h2 { margin: 18px 0 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
  .empty p { max-width: 42ch; margin: 8px 0 0; color: var(--ink-3); font-size: 14.5px; }
  .empty .row { justify-content: center; }
  .waiting { display: flex; align-items: center; gap: 10px; padding: 18px 4px; font-size: 13px; color: var(--ink-3); }
  .waiting .bars { display: inline-flex; gap: 3px; }
  .waiting .bars span { width: 3px; height: 12px; border-radius: 2px; background: var(--ink-3); animation: wave 1.1s ease-in-out infinite; }
  .waiting .bars span:nth-child(2) { animation-delay: .15s; } .waiting .bars span:nth-child(3) { animation-delay: .3s; }
  .fresh { animation: arrive .45s cubic-bezier(.2,.7,.2,1); }
  @keyframes arrive { from { opacity: 0; transform: translateY(6px); } }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes wave { 50% { transform: scaleY(.4); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="mark" aria-hidden="true">L</div>
    <button class="rail-btn" data-tab="live" data-tip="Live lesson" aria-label="Live lesson"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span class="flag live" id="liveFlag" hidden></span></button>
    <button class="rail-btn" data-tab="review" data-tip="Review" aria-label="Review"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="7" width="13" height="13" rx="2.5"/><path d="M8 4h9.5A2.5 2.5 0 0 1 20 6.5V16"/></svg><span class="flag" id="dueFlag" hidden></span></button>
    <button class="rail-btn" data-tab="quiz" data-tip="Quiz" aria-label="Quiz"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 16.9v.1"/></svg></button>
    <button class="rail-btn" data-tab="lessons" data-tip="Lessons" aria-label="Lessons"><svg class="i" viewBox="0 0 24 24"><path d="M5 18V6a2 2 0 0 1 2-2h12v13H7a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h12"/></svg></button>
    <button class="rail-btn" data-tab="progress" data-tip="Progress" aria-label="Progress"><svg class="i" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></button>
    <div class="spacer"></div>
    <button class="rail-btn" id="themeBtn" data-tip="Light mode" aria-label="Switch theme"></button>
  </nav>
  <div class="canvas">
    <header class="bar">
      <div class="brand">Learn with Claude <span id="viewName"></span></div>
      <div class="bar-meta">
        <span id="due"></span><span id="streak" class="tnum"></span>
        <button id="agent" class="agent" aria-haspopup="true" aria-expanded="false" aria-live="polite" hidden></button>
        <button id="bell" class="bell" title="Notify me when Claude finishes or needs me" aria-label="Enable notifications" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></button>
      </div>
      <div id="sessions" class="sessions" role="menu" hidden></div>
    </header>
    <nav class="tabs" aria-label="Sections">
      <button class="tab" data-tab="live">Live</button>
      <button class="tab" data-tab="review">Review</button>
      <button class="tab" data-tab="quiz">Quiz</button>
      <button class="tab" data-tab="lessons">Lessons</button>
      <button class="tab" data-tab="progress">Progress</button>
    </nav>
    <div class="scroll" id="scroll"><main class="content" id="view"></main></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
// Tiny markdown: fenced code blocks, `code`, **bold**, line breaks.
const md = (s) => String(s ?? '').split(/```[\w-]*\n?/).map((part, i) => (i % 2
  ? `<pre><code>${esc(part.replace(/\n$/, ''))}</code></pre>`
  : inline(part).replace(/\n/g, '<br>'))).join('');
const api = (p, body) => fetch(p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {}).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pad = (n) => String(n).padStart(2, '0');

const ICON = {
  check: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  lock: '<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/></svg>',
  live: '<svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  cards: '<svg class="i" viewBox="0 0 24 24"><rect x="4" y="7" width="13" height="13" rx="2.5"/><path d="M8 4h9.5A2.5 2.5 0 0 1 20 6.5V16"/></svg>',
  quiz: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4"/><path d="M12 16.9v.1"/></svg>',
  book: '<svg class="i" viewBox="0 0 24 24"><path d="M5 18V6a2 2 0 0 1 2-2h12v13H7a2 2 0 0 0-2 2v0a2 2 0 0 0 2 2h12"/></svg>',
  sun: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>',
  moon: '<svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
};
const VIEW = { live: 'Live', review: 'Review', quiz: 'Quiz', lessons: 'Lessons', progress: 'Progress' };
const empty = (icon, title, text, action = '') => `<div class="empty">${ICON[icon]}<h2>${title}</h2><p>${text}</p>${action}</div>`;

let S = null, tab = 'review';
let review = { queue: [], i: 0, flipped: false, done: 0 };
let quiz = { view: 'home', round: [], i: 0, answered: null, results: [], label: '' };
let quizFilter = 'all';
const openQs = new Set();

async function refresh() {
  S = await api('/api/state');
  S.lives = S.lives || []; S.agents = S.agents || []; S.quizzes = S.quizzes || []; S.due = S.due || [];
  const open = S.lives.reduce((n, l) => n + l.quizzes.filter((q) => !q.answered).length, 0);
  document.title = open ? `(${open}) Learn with Claude` : 'Learn with Claude';
  $('#liveFlag').hidden = !S.lives.some((l) => l.status === 'live');
  const p = S.progress;
  $('#dueFlag').hidden = !p.cards_due;
  $('#due').textContent = p.cards_due ? `${p.cards_due} due` : '';
  $('#streak').textContent = p.streak_days ? `${p.streak_days}-day streak` : '';
  showAgents(S.agents);
}

// ---------- Agent activity (from the Claude Code hooks; one entry per coding session) ----------
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.round(m / 60)} h ago`; };
const RANK = { waiting: 0, working: 1, idle: 2, done: 3 };
const seenSessions = new Map(); // session -> "state:at"; empty until the first load, so old events don't notify
let firstAgents = true;
// A session that says "working" but hasn't moved in 30 minutes was probably closed without a Stop.
const stateOf = (a) => (a.state === 'working' && Date.now() - a.at > 30 * 60000 ? 'idle' : a.state);
function sessionsShown(list) {
  const shown = list.filter((a) => stateOf(a) !== 'done' || Date.now() - a.at < 2 * 3600000);
  // Two sessions in the same project get a short id so they can be told apart.
  const count = {};
  for (const a of shown) count[a.project] = (count[a.project] || 0) + 1;
  return shown.map((a) => ({ ...a, st: stateOf(a), name: (a.project || 'session') + (count[a.project] > 1 ? ` · ${a.session.slice(0, 4)}` : '') }))
    .sort((a, b) => RANK[a.st] - RANK[b.st] || b.at - a.at);
}
function sessionLine(a) {
  if (a.st === 'working') return 'Working';
  if (a.st === 'waiting') return 'Needs your input';
  if (a.st === 'idle') return `Idle since ${ago(a.at)}`;
  return `Finished ${ago(a.at)}`;
}
function showAgents(list) {
  const shown = sessionsShown(list);
  const el = $('#agent');
  el.hidden = !shown.length;
  if (shown.length) {
    const a = shown[0];
    const label = a.st === 'waiting' ? `${a.name} needs you${a.message ? `: ${a.message}` : ''}`
      : a.st === 'working' ? `Claude is working · ${a.name}` : `${sessionLine(a)} · ${a.name}`;
    el.className = `agent ${a.st === 'idle' ? 'done' : a.st}`;
    el.title = shown.length > 1 ? `${shown.length} coding sessions` : a.message || '';
    el.innerHTML = `${a.st === 'done' ? ICON.check : '<span class="dot"></span>'}<span class="txt">${esc(label)}</span>${shown.length > 1 ? `<span class="more">+${shown.length - 1}</span>` : ''}`;
  }
  if (!$('#sessions').hidden) renderSessions();
  for (const a of shown) {
    const key = `${a.state}:${a.at}`;
    const before = seenSessions.get(a.session);
    if (!firstAgents && before !== key && (a.state === 'done' || a.state === 'waiting')) notify(a);
    seenSessions.set(a.session, key);
  }
  firstAgents = false;
}
function renderSessions() {
  const shown = sessionsShown(S.agents);
  $('#sessions').innerHTML = `<h4>Coding sessions</h4>${shown.map((a) => `
    <button class="session" data-st="${a.st}" data-session-project="${esc(a.project)}" role="menuitem">
      <span class="dot"></span>
      <span class="body2"><span class="name">${esc(a.name)}</span> <span class="state">${esc(sessionLine(a))}</span>
      ${a.st === 'waiting' && a.message ? `<span class="msg">${esc(a.message)}</span>` : ''}</span>
    </button>`).join('')}`;
}
function toggleSessions(open = $('#sessions').hidden) {
  $('#sessions').hidden = !open;
  $('#agent').setAttribute('aria-expanded', open);
  if (open) renderSessions();
}
function notify(a) {
  const name = a.project || 'your project';
  const title = a.state === 'done' ? `Claude finished · ${name}` : `Claude needs your input · ${name}`;
  const msg = a.state === 'done' ? 'Check the terminal for the result.' : (a.message || 'Switch to the terminal to answer.');
  document.querySelectorAll(`.toast[data-session="${CSS.escape(a.session)}"]`).forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.dataset.session = a.session;
  t.innerHTML = `<div><div class="eyebrow">${esc(title)}</div><div class="msg">${esc(msg)}</div></div><button class="close" aria-label="Dismiss">${ICON.x}</button>`;
  t.querySelector('.close').onclick = () => t.remove();
  $('#toasts').append(t);
  if (a.state === 'done') setTimeout(() => t.remove(), 8000);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body: msg, tag: `learn-${a.session}` }); } catch { /* not allowed here */ }
  }
}
// Browser notifications need a click to ask for permission; offer it once, quietly.
if ('Notification' in window && Notification.permission === 'default') {
  $('#bell').hidden = false;
  $('#bell').onclick = () => Notification.requestPermission().then(() => { $('#bell').hidden = true; });
}
setInterval(() => S && showAgents(S.agents), 30000); // keep "x min ago" fresh

// ---------- Theme: follows the system until the viewer picks one ----------
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintThemeBtn() {
  const b = $('#themeBtn');
  b.innerHTML = isDark() ? ICON.sun : ICON.moon;
  b.dataset.tip = isDark() ? 'Light mode' : 'Dark mode';
}
$('#themeBtn').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('learn.theme', next); } catch { /* private mode: the choice lasts for this tab */ }
  paintThemeBtn();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);
paintThemeBtn();

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// One multiple-choice question. `chosen`/`correct` are option indexes once answered.
function options(order, opts, attr, answered) {
  return `<div class="opts">${order.map((k, n) => {
    const cls = answered ? (k === answered.correct ? 'right' : k === answered.chosen ? 'wrong' : '') : '';
    const key = cls === 'right' ? ICON.check : cls === 'wrong' ? ICON.x : 'ABCD'[n];
    return `<button class="opt ${cls}" ${attr}="${k}" ${answered ? 'disabled' : ''}><span class="key">${key}</span><span>${inline(opts[k])}</span></button>`;
  }).join('')}</div>`;
}
function verdict(ok, explanation, missedNote) {
  return `<div class="verdict ${ok ? 'right' : 'wrong'}"><div class="label">${ok ? 'Correct' : 'Not quite'}</div>
    <div class="body">${md(explanation)}</div>${!ok && missedNote ? '<div class="note">Added to your review deck.</div>' : ''}</div>`;
}

// ---------- Live lesson ----------
const seen = new Set();
const KIND = { predict: 'Predict', check: 'Check', diff: 'About the change' };
function seededOrder(id, n) {
  let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const a = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { h = (h * 1103515245 + 12345) >>> 0; const j = h % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fresh(id) { if (seen.has(id)) return ''; seen.add(id); return 'fresh'; }
function liveQuiz(q) {
  const a = q.answered;
  return `<div class="panel ${fresh(q.id)}">
    <div class="eyebrow">${KIND[q.kind] || 'Question'}</div>
    <div class="q">${inline(q.question)}</div>
    ${options(seededOrder(q.id, q.options.length), q.options, 'data-live-k', a && { chosen: a.chosen, correct: a.correctIndex }).replace(/data-live-k=/g, `data-live="${q.id}" data-k=`)}
    ${a ? verdict(a.correct, a.explanation, true) : ''}
  </div>`;
}
let liveProject = null; // which project's lesson the Live tab shows when several sessions are building
const currentLive = () => S.lives.find((l) => l.project === liveProject) || S.lives[0] || null;
function renderLive() {
  const L = currentLive();
  if (!L) return empty('live', 'Nothing in progress', 'Ask Claude to build or change something. The lesson appears here while it works.');
  liveProject = L.project;
  const switcher = S.lives.length > 1 ? `<div class="switch" role="tablist" aria-label="Projects">${S.lives.map((l) => `
    <button data-project="${esc(l.project)}" aria-pressed="${l.project === L.project}">${l.status === 'live' ? '<span class="dot"></span>' : ''}${esc(l.project)}</button>`).join('')}</div>` : '';
  const building = L.status === 'live';
  // Items saved together share a timestamp: show predict, then note, then check, and keep a note locked
  // until the prediction saved with it is answered (guess first, then learn).
  const rank = (it) => (it.t === 'note' ? 1 : it.kind === 'predict' ? 0 : 2);
  const early = [...L.notes.map((n) => ({ t: 'note', ...n })), ...L.quizzes.filter((q) => q.kind !== 'diff').map((q) => ({ t: 'quiz', ...q }))]
    .sort((a, b) => a.createdAt - b.createdAt || rank(a) - rank(b));
  const locked = (n) => L.quizzes.some((q) => q.kind === 'predict' && q.createdAt === n.createdAt && !q.answered);
  const diffQs = L.quizzes.filter((q) => q.kind === 'diff');
  const s = L.score;
  let concept = 0;
  return `${switcher}<div class="head">
      <div class="status ${building ? 'live' : ''}"><span class="dot"></span>${building ? 'Building' : 'Complete'} <span>· ${esc(L.project)}</span></div>
      <h1 class="title">${esc(L.title)}</h1>
    </div>
    <div class="stack">
    ${L.critique ? `<div class="soft"><div class="eyebrow">Critique</div>${md(L.critique)}</div>` : ''}
    ${early.map((it) => {
      if (it.t !== 'note') return liveQuiz(it);
      concept += 1;
      return locked(it)
        ? `<div class="panel locked"><div class="eyebrow">Concept ${pad(concept)}</div><h3>${esc(it.title)}</h3><div class="hint">${ICON.lock}Answer the prediction above to unlock</div></div>`
        : `<div class="panel ${fresh(it.id)}"><div class="eyebrow">Concept ${pad(concept)}</div><h3>${esc(it.title)}</h3><div class="body">${md(it.body)}</div></div>`;
    }).join('')}
    </div>
    ${L.changes.length ? `<div class="section eyebrow">What changed and why</div>
      <div class="stack"><div class="panel ${fresh(L.id + ':changes')}">${L.summary ? `<p class="body" style="margin:0 0 10px">${md(L.summary)}</p>` : ''}
      ${L.changes.map((c) => `<div class="change">${c.file ? `<div class="file">${esc(c.file)}</div>` : ''}<div class="what">${inline(c.what)}</div><div class="why">${inline(c.why)}</div></div>`).join('')}</div>
      ${diffQs.map(liveQuiz).join('')}</div>` : ''}
    ${building
      ? `<div class="waiting"><span class="bars"><span></span><span></span><span></span></span>Claude is building. New questions appear here as they are ready.</div>`
      : `<div class="section eyebrow">Result</div>
         <div class="panel flush"><div class="figures">
           <div class="figure"><div class="v">${s.correctFirstTry}/${s.answered}</div><div class="u">correct first try</div></div>
           <div class="figure"><div class="v">${s.total - s.answered}</div><div class="u">still open</div></div>
           <div class="figure"><div class="v">${L.cards}</div><div class="u">${L.cards === 1 ? 'flashcard' : 'flashcards'}, back tomorrow</div></div>
         </div></div>`}`;
}
const pending = new Set(); // questions whose answer is on its way: ignore extra clicks
async function answerLive(id, k) {
  if (pending.has(id)) return;
  pending.add(id);
  try { await api('/api/answer', { quiz_id: id, chosen_index: k }); await refresh(); render(); } finally { pending.delete(id); }
}

// ---------- Review ----------
function startReview() { review = { queue: S.due.slice(), i: 0, flipped: false, done: 0 }; }
function renderReview() {
  const { queue, i, flipped, done } = review;

    return empty('cards', done ? `${plural(done, 'card')} reviewed` : 'Nothing due',
      `Cards return just before you would forget them. ${S.progress.cards ? `${plural(S.progress.cards, 'card')} in your deck.` : 'Build something in teach mode to create your first cards.'}`,
      S.quizzes.length ? '<div class="row"><button class="btn" data-go="quiz">Take a quiz instead</button></div>' : '');
  }

  <div class="panel" style="padding:28px 28px 24px">

    <div class="card-front">${md(c.front)}</div>

      ? `<div class="card-back">${md(c.back)}</div>

           <button data-grade="good">Good <kbd>3</kbd></button><button data-grade="easy">Easy <kbd>4</kbd></button>

}
async function grade(g) {
  const c = review.queue[review.i];
  await api('/api/grade', { card_id: c.id, grade: g });
  if (g === 'again') review.queue.push(c); // see it again this session
  review.i++; review.done++; review.flipped = false;
  await refresh(); render();
}

// ---------- Quiz ----------
// Status of a question for the quiz home: passed (last answer right), missed (last answer wrong), new.
const qStatus = (q) => (q.attempts === 0 ? 'new' : q.lastCorrect ? 'passed' : 'missed');
function startRound(list, label) {
  quiz = { view: 'round', label, i: 0, answered: null, results: [],
    round: list.map((q) => ({ ...q, order: shuffle(q.options.map((_, k) => k)) })) };
  render();
  $('#scroll').scrollTop = 0;
}
function smartRound() {
  const rank = (q) => ({ new: 0, missed: 1, passed: 2 }[qStatus(q)]);
  return shuffle(S.quizzes.slice()).sort((a, b) => rank(a) - rank(b)).slice(0, 8);
}
function startQuiz() { quiz = { view: 'home', round: [], i: 0, answered: null, results: [], label: '' }; }
function renderQuizHome() {
  const qs = S.quizzes;
  if (!qs.length) return empty('quiz', 'No questions yet', 'Questions are written while Claude builds in teach mode.');
  const count = { passed: 0, missed: 0, new: 0 };
  for (const q of qs) count[qStatus(q)] += 1;
  const byLesson = new Map();
  for (const q of qs) { if (!byLesson.has(q.lessonId)) byLesson.set(q.lessonId, []); byLesson.get(q.lessonId).push(q); }
  const lessons = [...byLesson].map(([id, list]) => ({ id, list, lesson: S.lessons.find((l) => l.id === id) }))
    .filter((x) => x.lesson).sort((a, b) => b.lesson.createdAt - a.lesson.createdAt);
  const shown = qs.filter((q) => quizFilter === 'all' || qStatus(q) === quizFilter)
    .sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0));
  const seg = (k, label, n) => `<button data-qfilter="${k}" aria-pressed="${quizFilter === k}">${label}<span class="n">${n}</span></button>`;
  return `<div class="head"><div class="eyebrow">Practice</div><h1 class="title">Quiz</h1>
      <p class="lede">${count.passed} of ${qs.length} passed${count.missed ? ` · ${count.missed} to retry` : ''}${count.new ? ` · ${count.new} new` : ''}</p>
      <div class="row">
        <button class="btn btn-dark" data-round="smart">Start a round</button>
        ${count.missed ? `<button class="btn" data-round="missed">Retry missed <kbd>${count.missed}</kbd></button>` : ''}
      </div></div>
    <div class="section eyebrow">By lesson</div>
    <div class="panel">${lessons.map(({ id, list, lesson }) => {
      const passed = list.filter((q) => qStatus(q) === 'passed').length;
      return `<div class="lesson-quiz">
        <div><div class="t">${esc(lesson.title)}</div><div class="m">${esc(lesson.project)} · ${plural(list.length, 'question')}</div></div>
        <div class="meter-col"><div class="meter" role="img" aria-label="${passed} of ${list.length} passed"><div style="width:${(passed / list.length) * 100}%"></div></div>
          <div class="score">${passed}/${list.length} passed</div></div>
        <button class="btn btn-sm" data-redo="${id}">${passed === list.length ? 'Redo' : passed || list.some((q) => q.attempts) ? 'Continue' : 'Start'}</button>
      </div>`;
    }).join('')}</div>
    <div class="section eyebrow">Questions</div>
    <div class="seg-filter" role="group" aria-label="Filter questions">${seg('all', 'All', qs.length)}${seg('passed', 'Passed', count.passed)}${seg('missed', 'To retry', count.missed)}${seg('new', 'New', count.new)}</div>
    <div class="panel" style="padding:6px 18px">${shown.length ? shown.map((q) => {
      const st = qStatus(q);
      const open = st === 'passed' && openQs.has(q.id);
      const ic = st === 'passed' ? `<span class="ic ok">${ICON.check}</span>` : st === 'missed' ? `<span class="ic no">${ICON.x}</span>` : '<span class="ic new"></span>';
      const meta = st === 'new' ? 'Not answered yet' : st === 'passed'
        ? (q.firstCorrect ? 'Right on the first try' : `Passed after ${plural(q.attempts, 'attempt')}`)
        : `Missed${q.attempts > 1 ? ` ${q.attempts} times` : ''}`;
      return `<div class="qrow">
        <div class="qrow-head">${ic}
          <span class="qt">${inline(q.question)}<span class="qm">${esc(meta)} · ${esc(q.lesson)}</span></span>
          <span class="act">${st === 'passed'
            ? `<button class="link" data-qopen="${q.id}" aria-expanded="${open}">${open ? 'Hide answer' : 'Show answer'}</button>`
            : `<button class="btn btn-sm" data-qone="${q.id}">${st === 'missed' ? 'Retry' : 'Answer'}</button>`}</span>
        </div>
        ${open && q.reveal ? `<div class="reveal"><b>${inline(q.reveal.answer)}</b><div style="margin-top:4px">${md(q.reveal.explanation)}</div>
          <div style="margin-top:8px"><button class="link" data-qone="${q.id}">Answer it again</button></div></div>` : ''}
      </div>`;
    }).join('') : `<p class="lede" style="padding:12px 4px;margin:0">Nothing here yet.</p>`}</div>`;
}
function renderQuiz() {
  if (quiz.view === 'home') return renderQuizHome();
  const { round, i, answered, results } = quiz;
  if (i >= round.length) {
    const right = results.filter((r) => r.correct).length;
    return `<div class="head"><div class="eyebrow">${esc(quiz.label)} · complete</div><h1 class="title">${right} of ${results.length} correct</h1>
      ${right < results.length ? '<p class="lede">Missed questions were added to your review deck.</p>' : '<p class="lede">All right. These count as passed.</p>'}</div>
      <ul class="results">${results.map((r) => `<li><span class="${r.correct ? 'ok' : 'no'}">${r.correct ? ICON.check : ICON.x}</span>
        <div>${inline(r.question)}${r.correct ? '' : `<div class="sub">${inline(r.answer)}</div>`}</div></li>`).join('')}</ul>
      <div class="row"><button class="btn btn-dark" data-round="smart">Another round</button><button class="btn" data-qhome>Back to quizzes</button></div>`;
  }
  const q = round[i];
  return `<div class="track"><div style="width:${(i / round.length) * 100}%"></div></div>
  <div class="panel" style="padding:28px 28px 24px">
    <div class="meta-row"><span class="counter">${pad(i + 1)} / ${pad(round.length)} · ${esc(quiz.label)}</span><button class="link" data-qhome>Exit</button></div>
    <div class="eyebrow">${esc(q.lesson)}</div>
    <div class="q" style="font-size:19px">${inline(q.question)}</div>
    ${options(q.order, q.options, 'data-opt', answered && { chosen: answered.chosen_index, correct: answered.correct_index })}
    ${answered ? `${verdict(answered.correct, answered.explanation, false)}
      <div class="row"><button class="btn btn-dark" data-next>${i + 1 < round.length ? 'Next' : 'See results'} <kbd>Enter</kbd></button></div>` : ''}
  </div>`;
}
async function answer(k) {
  const q = quiz.round[quiz.i];
  if (quiz.answered || pending.has(q.id)) return;
  pending.add(q.id);
  let r;
  try { r = await api('/api/answer', { quiz_id: q.id, chosen_index: k }); } finally { pending.delete(q.id); }
  quiz.answered = { ...r, chosen_index: k };
  quiz.results.push({ question: q.question, correct: r.correct, answer: r.correct_answer });
  await refresh(); render();
}

// ---------- Progress ----------
// Tooltip rows: [value, label, color var]. Labels go in with textContent: they come from lesson data.
function tipAttrs(title, rows) {
  return `tabindex="0" data-tip-title="${esc(title)}" data-tip-rows="${esc(JSON.stringify(rows))}"`;
}
function showTip(el, x, y) {
  const tip = $('#tip');
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 't'; t.textContent = el.dataset.tipTitle; tip.append(t);
  for (const [v, label, color] of JSON.parse(el.dataset.tipRows)) {
    const r = document.createElement('div'); r.className = 'r';
    if (color) { const i = document.createElement('i'); i.style.background = `var(${color})`; r.append(i); }
    const b = document.createElement('b'); b.textContent = v; r.append(b);
    r.append(document.createTextNode(label));
    tip.append(r);
  }
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = `${Math.min(x + 14, innerWidth - w - 8)}px`;
  tip.style.top = `${Math.max(8, y - h - 12)}px`;
}
document.addEventListener('pointermove', (e) => {
  const el = e.target.closest('[data-tip-rows]');
  if (el) showTip(el, e.clientX, e.clientY); else $('#tip').hidden = true;
});
document.addEventListener('focusin', (e) => {
  const el = e.target.closest('[data-tip-rows]');
  if (!el) return;
  const r = el.getBoundingClientRect();
  showTip(el, r.left + r.width / 2, r.top);
});
document.addEventListener('focusout', () => { $('#tip').hidden = true; });

const dayLabel = (iso, short) => new Date(`${iso}T12:00:00`).toLocaleDateString(undefined, short ? { weekday: 'narrow' } : { weekday: 'short', day: 'numeric', month: 'short' });
const niceMax = (n) => (n <= 4 ? 4 : n <= 10 ? Math.ceil(n / 2) * 2 : Math.ceil(n / 5) * 5);
const table = (head, rows) => `<details class="table"><summary>View as table</summary><table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;

function activityChart(days) {
  const max = niceMax(Math.max(1, ...days.map((d) => d.correct + d.missed)));
  const h = (n) => `${(n / max) * 100}%`;
  return `<div class="panel chart-card">
    <div class="chart-head"><div><h3>Questions answered</h3><div class="sub">Last 14 days</div></div>
      <div class="legend"><span><i style="background:var(--c-good)"></i>Correct</span><span><i style="background:var(--c-bad)"></i>Missed</span></div></div>
    <div class="cols" role="img" aria-label="Questions answered per day over the last 14 days">
      <div class="grid" style="bottom:100%"><span>${max}</span></div><div class="grid" style="bottom:50%"><span>${max / 2}</span></div>
      ${days.map((d) => `<div class="col" ${tipAttrs(dayLabel(d.day), [[String(d.correct), 'correct', '--c-good'], [String(d.missed), 'missed', '--c-bad'], [String(d.reviews), d.reviews === 1 ? 'card reviewed' : 'cards reviewed', '']])}>
        ${d.correct ? `<div class="seg" style="height:${h(d.correct)};background:var(--c-good)"></div>` : ''}
        ${d.missed ? `<div class="seg" style="height:${h(d.missed)};background:var(--c-bad)"></div>` : ''}
      </div>`).join('')}
    </div>
    <div class="xlabels">${days.map((d, i) => `<span>${i === days.length - 1 ? 'Today' : dayLabel(d.day, true)}</span>`).join('')}</div>
    ${table(['Day', 'Correct', 'Missed', 'Cards reviewed'], days.map((d) => [dayLabel(d.day), d.correct, d.missed, d.reviews]))}
  </div>`;
}

function topicsChart(topics) {
  if (!topics.length) return '';
  const rows = topics.slice(0, 8);
  // Emphasis, not a rainbow: weak topics in the "missed" color, strong ones in the "correct" color, the rest gray.
  const tone = (t) => (t.accuracy < 60 ? ['--c-bad', 'Needs work'] : t.accuracy >= 85 ? ['--c-good', 'Strong'] : ['--o2', '']);
  return `<div class="panel chart-card">
    <div class="chart-head"><div><h3>Topics, weakest first</h3><div class="sub">Right on the first try</div></div>
      <div class="legend"><span><i style="background:var(--c-bad)"></i>Needs work</span><span><i style="background:var(--o2)"></i>Getting there</span><span><i style="background:var(--c-good)"></i>Strong</span></div></div>
    <div class="bars">${rows.map((t) => {
      const [color, flag] = tone(t);
      return `<div class="bar-row" ${tipAttrs(t.tag, [[`${t.accuracy}%`, `first try (${t.firstTry} of ${t.answered})`, color], [`${Math.round((100 * t.now) / t.answered)}%`, 'after retries', ''], [String(t.lapses), 'flashcard lapses', '']])}>
        <span class="name">${esc(t.tag)}</span>
        <span class="lane"><span class="fill" style="display:block;width:${Math.max(t.accuracy, 1)}%;background:var(${color})"></span></span>
        <span class="val"><b>${t.accuracy}%</b>${flag ? `<span class="flag-txt">${flag}</span>` : ''}</span>
      </div>`;
    }).join('')}</div>
    <div class="bar-axis"><span></span><span class="ticks"><span>0</span><span>50%</span><span>100%</span></span><span></span></div>
    ${table(['Topic', 'First try', 'Answered', 'After retries', 'Flashcard lapses'], topics.map((t) => [t.tag, `${t.accuracy}%`, t.answered, `${Math.round((100 * t.now) / t.answered)}%`, t.lapses]))}
  </div>`;
}

function memoryChart(m) {
  const parts = [['new', 'New', '--o1'], ['learning', 'Learning', '--o2'], ['young', 'Remembered', '--o3'], ['mature', 'Mastered', '--o4']];
  const total = parts.reduce((n, [k]) => n + m[k], 0);
  if (!total) return '';
  return `<div class="panel chart-card">
    <div class="chart-head"><div><h3>Memory strength</h3><div class="sub">${plural(total, 'flashcard')}. Mastered means you remembered it 3 weeks out.</div></div></div>
    <div class="stack-bar" role="img" aria-label="Flashcards by memory strength">${parts.filter(([k]) => m[k]).map(([k, label, c]) =>
      `<div style="flex:${m[k]};background:var(${c})" ${tipAttrs(label, [[String(m[k]), `card${m[k] === 1 ? '' : 's'} · ${Math.round((100 * m[k]) / total)}%`, c]])}></div>`).join('')}</div>
    <div class="stack-legend">${parts.map(([k, label, c]) => `<span><i style="background:var(${c})"></i>${label} <b>${m[k]}</b></span>`).join('')}</div>
  </div>`;
}

function renderProgress() {
  const p = S.progress, I = p.insights;
  if (!p.lessons) return empty('book', 'Nothing to chart yet', 'Build something in teach mode. Your progress shows up here.');
  const weak = I.topics.find((t) => t.accuracy < 60);

  const story = [
    `You have learned <b>${plural(I.concepts, 'concept')}</b> across <b>${plural(I.projects, 'project')}</b>.`,
    strong ? `Strongest: <b>${esc(strong.tag)}</b> (${strong.accuracy}% right first time).` : '',
    weak ? `Worth another look: <b>${esc(weak.tag)}</b> (${weak.accuracy}%).` : '',
    I.fixed ? `You fixed <b>${plural(I.fixed, 'mistake')}</b> by retrying.` : '',
  ].filter(Boolean).join(' ');
  const fig = (v, u) => `<div class="figure"><div class="v">${v ?? '–'}</div><div class="u">${u}</div></div>`;
  return `<div class="head"><div class="eyebrow">Overview</div><h1 class="title">Progress</h1></div>
  <p class="insight">${story}</p>
  <div class="stack" style="margin-top:24px">

      ${fig(I.answered14, 'answered, 14 days')}${fig(p.first_try_accuracy != null ? `${p.first_try_accuracy}%` : null, 'right first time')}
      ${fig(p.cards_mature, 'cards mastered')}${fig(p.streak_days, 'day streak')}

    ${activityChart(I.days)}
    ${topicsChart(I.topics)}
    ${memoryChart(I.memory)}
  </div>
  ${weak ? `<div class="row"><button class="btn btn-dark" data-round="weak" data-tag="${esc(weak.tag)}">Practice ${esc(weak.tag)}</button>${p.cards_due ? `<button class="btn" data-go="review">Review ${plural(p.cards_due, 'due card')}</button>` : ''}</div>` : ''}
  ${p.recent_lessons.length ? `<div class="section eyebrow">Recent lessons</div><ul class="results" style="margin:0">${p.recent_lessons.map((l) => `<li style="justify-content:space-between"><span>${esc(l.title)}</span><span class="sub tnum">${l.score.correctFirstTry}/${l.score.answered} first try</span></li>`).join('')}</ul>` : ''}`;
}

function render() {
  document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  $('#viewName').textContent = `/ ${VIEW[tab]}`;
  $('#view').innerHTML = { live: renderLive, review: renderReview, quiz: renderQuiz, lessons: renderLessons, progress: renderProgress }[tab]();
}
function go(t) {
  // Re-selecting the current tab keeps a review or quiz round in progress.
  const same = t === tab;
  tab = t;
  if (t === 'review' && !(same && review.i < review.queue.length && review.i > 0)) startReview();
  if (t === 'quiz' && !(same && quiz.view === 'round' && quiz.i < quiz.round.length)) startQuiz();
  render();
  $('#scroll').scrollTop = 0;
}

// A failed save must be visible: otherwise the page just looks frozen.
function fail(err) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<div><div class="eyebrow">Could not save</div><div class="msg">${esc(err.message || err)}. Reload the page; if it persists, restart Claude Code.</div></div><button class="close" aria-label="Dismiss">${ICON.x}</button>`;
  t.querySelector('.close').onclick = () => t.remove();
  $('#toasts').append(t);
}
window.addEventListener('unhandledrejection', (e) => fail(e.reason));

document.addEventListener('click', (e) => {
  if (!$('#sessions').hidden && !e.target.closest('#sessions, #agent')) toggleSessions(false);
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'agent') return toggleSessions();
  if (b.dataset.project) { liveProject = b.dataset.project; return render(); }
  if (b.dataset.sessionProject !== undefined) {
    toggleSessions(false);
    if (S.lives.some((l) => l.project === b.dataset.sessionProject)) { liveProject = b.dataset.sessionProject; go('live'); }
    return;
  }
  if (b.dataset.tab) return go(b.dataset.tab);
  if (b.dataset.go) return go(b.dataset.go);
  if (b.hasAttribute('data-flip')) { review.flipped = true; return render(); }
  if (b.dataset.grade) return grade(b.dataset.grade);
  if (b.dataset.live) return answerLive(b.dataset.live, Number(b.dataset.k));
  if (b.dataset.opt) return answer(Number(b.dataset.opt));
  if (b.dataset.lesson) { const id = b.dataset.lesson; openLessons.has(id) ? openLessons.delete(id) : openLessons.add(id); return render(); }
  if (b.hasAttribute('data-next')) { quiz.i++; quiz.answered = null; return render(); }
  if (b.dataset.round) {
    const r = b.dataset.round;
    const list = r === 'missed' ? S.quizzes.filter((q) => qStatus(q) === 'missed')
      : r === 'weak' ? S.quizzes.filter((q) => q.tags.includes(b.dataset.tag)) : smartRound();
    if (tab !== 'quiz') tab = 'quiz';
    return startRound(shuffle(list.slice()).slice(0, 10), r === 'missed' ? 'Retry missed' : r === 'weak' ? `Practice ${b.dataset.tag}` : 'Round');
  }
  if (b.dataset.redo) {
    const l = S.lessons.find((x) => x.id === b.dataset.redo);
    return startRound(S.quizzes.filter((q) => q.lessonId === b.dataset.redo), l ? l.title : 'Lesson');
  }
  if (b.dataset.qone) { const q = S.quizzes.find((x) => x.id === b.dataset.qone); if (q) startRound([q], 'One question'); return; }
  if (b.dataset.qopen) { openQs.has(b.dataset.qopen) ? openQs.delete(b.dataset.qopen) : openQs.add(b.dataset.qopen); return render(); }
  if (b.dataset.qfilter) { quizFilter = b.dataset.qfilter; return render(); }
  if (b.hasAttribute('data-qhome')) { startQuiz(); return render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#sessions').hidden) return toggleSessions(false);
  if (e.metaKey && e.key !== 'Enter') return;
  if (e.target.tagName === 'TEXTAREA' && e.key !== 'Enter') return;
  if (tab === 'review' && review.i < review.queue.length) {
    if (!review.flipped && (e.key === ' ' || (e.key === 'Enter' && (e.metaKey || e.ctrlKey)))) { e.preventDefault(); review.flipped = true; render(); }
    else if (review.flipped && '1234'.includes(e.key)) { e.preventDefault(); grade(['again', 'hard', 'good', 'easy'][e.key - 1]); }
  }
  if (tab === 'quiz' && quiz.view === 'round' && quiz.i < quiz.round.length) {
    const q = quiz.round[quiz.i];
    if (!quiz.answered && 'abcd'.includes(e.key.toLowerCase()) && e.key.length === 1) { e.preventDefault(); const n = 'abcd'.indexOf(e.key.toLowerCase()); if (q.order[n] != null) answer(q.order[n]); }
    // preventDefault: otherwise Enter also "clicks" whatever button has focus (e.g. the Quiz tab, restarting the round).
    else if (quiz.answered && e.key === 'Enter') { e.preventDefault(); quiz.i++; quiz.answered = null; render(); }
  }
});

// Live updates: poll a cheap stamp; refetch only when the deck changed.
// Only the Live tab re-renders automatically, so a review or quiz in progress is never disrupted.
let lastStamp = 0;
setInterval(async () => {
  try {
    const { stamp } = await api('/api/stamp');
    if (stamp === lastStamp) return;
    lastStamp = stamp;
    const known = new Set(S ? S.lives.map((l) => l.id) : []);
    await refresh();
    const started = S.lives.find((l) => !known.has(l.id) && l.status === 'live');
    const busy = (tab === 'review' && review.i > 0) || (tab === 'quiz' && quiz.view === 'round');
    // A new lesson takes the Live tab only if nothing else is being followed there.
    if (started && !busy && (tab !== 'live' || !S.lives.some((l) => l.project === liveProject && l.status === 'live' && l.id !== started.id))) liveProject = started.project;
    if (tab === 'live') render();
    else if (started && !busy) go('live');
  } catch { /* server restarting; try again next tick */ }
}, 1500);

refresh().then(() => { lastStamp = S.stamp; go(S.lives.length ? 'live' : S.progress.cards_due ? 'review' : S.quizzes.length ? 'quiz' : 'lessons'); })
  .catch((e) => { $('#view').innerHTML = empty('live', 'Cannot reach the learn server', esc(e.message)); });
</script>
